<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ALIET Student Placement Registration</title>
    <style>
        /* Modern & Clean Color Palette */
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #1e3a8a; /* Deep professional blue */
            --primary-hover: #1d4ed8;
            --text-color: #333333;
            --border-color: #cccccc;
            --focus-ring: #93c5fd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px var(--focus-ring);
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>WELCOME CSE(AI&ML) ENGINEERS</h2>
        <form action="#" method="POST">
            
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="LAYOLA" required>
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="winson@gmail.com" required>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="9876543210" required>
            </div>

            <!-- Department & Roll Number Row -->
            <div class="row">
                <div class="form-group">
                    <label for="dept">Department</label>
                    <select id="dept" name="dept" required>
                        <option value="" disabled selected>Select</option>
                        <option value="CSE">CSE(AI&ML)</option>
                        <option value="IT">Information Technology</option>
                        <option value="ECE">Electronics</option>
                        <option value="MECH">Mechanical</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rollno">Roll Number</label>
                    <input type="text" id="rollno" name="rollno" placeholder="CS2401" required>
                </div>
            </div>

            <!-- CGPA & Graduation Year Row -->
            <div class="row">
                <div class="form-group">
                    <label for="cgpa">Current CGPA</label>
                    <input type="number" id="cgpa" name="cgpa" placeholder="8.5" step="0.01" min="0" max="10" required>
                </div>
                <div class="form-group">
                    <label for="year">Graduation Year</label>
                    <input type="number" id="year" name="year" placeholder="2027" min="2024" max="2035" required>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit">Register Now</button>

        </form>
    </div>

</body>
</html>
